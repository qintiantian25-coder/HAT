[common]
name = train_HAT_blind_restoration
dataset_root = /home/student_server/Qtt/NAFNet/data_new
experiments_root = ./experiments
model_type = HATModel
scale = 1
num_gpu = 1
manual_seed = 0

[paths]
train_gt = /home/student_server/Qtt/NAFNet/data_new/train_sharp
train_lq = /home/student_server/Qtt/NAFNet/data_new/train_blur
val_gt = /home/student_server/Qtt/NAFNet/data_new/val_sharp
val_lq = /home/student_server/Qtt/NAFNet/data_new/val_blur

[train]
# 显存安全区：降低图像块尺寸以支持更长周期的训练
gt_size = 64
batch_size_per_gpu = 1
num_worker_per_gpu = 2
use_amp = true
# 梯度累积：保持训练稳定性
gradient_accumulation_steps = 4
ema_decay = 0.999
total_iter = 250000
warmup_iter = 1500
lr = 0.0001
weight_decay = 0.0001
# 针对 250k 迭代优化的学习率衰减节点
milestones = 125000, 180000, 210000, 230000
gamma = 0.5
val_freq = 5000
use_hflip = true
use_rot = true

[network_g]
type = HAT
upscale = 1
in_chans = 1
img_size = 64
window_size = 16
depths = 6, 6, 6, 6, 6, 6
embed_dim = 180
num_heads = 6, 6, 6, 6, 6, 6
mlp_ratio = 2
upsampler = 
resi_connection = 1conv
# 必须开启以防止大模型显存爆炸
use_checkpoint = true

[logger]
# 确保此值 > 0 以避免 ZeroDivisionError
save_checkpoint_freq = 5000
print_freq = 100
use_tb_logger = true
training_log_file = experiments/logs/training.txt
validation_log_file = experiments/logs/validation.txt