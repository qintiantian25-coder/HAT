[common]
name = train_HAT_blind_restoration
dataset_root = /home/student_server/Qtt/NAFNet/data_new
experiments_root = ./experiments
model_type = HATModel
scale = 1
num_gpu = 1
manual_seed = 0
# 新增：每 5 个 epoch 验证一次
val_freq_epochs = 5

[paths]
train_gt = /home/student_server/Qtt/NAFNet/data_new/train_sharp
train_lq = /home/student_server/Qtt/NAFNet/data_new/train_blur
val_gt = /home/student_server/Qtt/NAFNet/data_new/val_sharp
val_lq = /home/student_server/Qtt/NAFNet/data_new/val_blur

[train]
gt_size = 128
batch_size_per_gpu = 1
num_worker_per_gpu = 2
use_amp = true
gradient_accumulation_steps = 4
ema_decay = 0.999
# 已修改：总迭代次数改为 150,000
total_iter = 150000
warmup_iter = 1500
lr = 0.0001
weight_decay = 0.0001
# 已按你的要求更新：milestones
milestones = 75000, 120000, 135000, 145000
gamma = 0.5
val_freq = 5000
use_hflip = true
use_rot = true

[network_g]
type = HAT
upscale = 1
in_chans = 1
img_size = 64
window_size = 16
depths = 6, 6, 6, 6, 6, 6
embed_dim = 180
num_heads = 6, 6, 6, 6, 6, 6
mlp_ratio = 2
upsampler = 
resi_connection = 1conv
use_checkpoint = true

[logger]
save_checkpoint_freq = 5000
print_freq = 100
use_tb_logger = true
training_log_file = experiments/logs/training.txt
validation_log_file = experiments/logs/validation.txt